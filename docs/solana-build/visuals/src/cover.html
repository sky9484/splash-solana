<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(Geist-Variable.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:GeistMono;src:url(GeistMono-Variable.woff2) format('woff2');font-weight:100 900}
:root{--bg:#F6F0ED;--ink:#1F4452;--slate:#326273;--teal:#5C9EAD;--tealtext:#387F96;--line:#E5DCD6;--ok:#2E7D6B;--coral:#E39774;--mist:#E7EEF1}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Geist,sans-serif}
body.full{background:var(--bg)} body.clear{background:transparent}
.stage{position:absolute;inset:0}

.halo{position:absolute;left:1210px;top:150px;width:720px;height:720px;border-radius:50%;background:var(--mist)}
.halo2{position:absolute;left:1690px;top:90px;width:180px;height:180px;border-radius:50%;border:2px solid var(--teal);opacity:.35}
.phone{position:absolute;left:1360px;top:118px;width:400px;height:836px;border-radius:66px;background:#0f1a1f;
  transform:rotate(6deg);box-shadow:0 10px 24px rgba(31,68,82,.18),inset 0 0 0 2px #2a3a42}
.pshadow{position:absolute;left:1390px;top:190px;width:380px;height:800px;border-radius:70px;background:rgba(31,68,82,.30);filter:blur(46px);transform:rotate(6deg)}
.phone:before{content:"";position:absolute;inset:5px;border-radius:61px;border:1px solid #33444c}
.screen{position:absolute;left:14px;top:14px;width:372px;height:808px;border-radius:53px;overflow:hidden;background:#fff}
.status{height:50px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 30px 0 34px;font-weight:600;font-size:15px;color:#0f1a1f}
.screen img{width:100%;display:block}
.island{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:104px;height:30px;border-radius:18px;background:#0f1a1f;z-index:3}
.notif{position:absolute;left:990px;top:575px;width:560px;background:#fff;border-radius:26px;padding:26px 30px 26px;
  box-shadow:0 30px 70px rgba(31,68,82,.22),0 6px 16px rgba(31,68,82,.10);border:1px solid var(--line)}
.anch{font-family:GeistMono;font-size:16px;letter-spacing:.08em;color:var(--slate);text-transform:uppercase;margin-top:14px;display:flex;gap:10px;align-items:center}
.chip{position:absolute;left:1060px;top:820px;background:#fff;border-radius:16px;padding:16px 22px;border:1px solid var(--line);
  border-left:6px solid var(--coral);box-shadow:0 20px 44px rgba(31,68,82,.16);font-size:22px;color:var(--ink);font-weight:600}
.row{display:flex;align-items:center;gap:14px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;font-size:26px;display:grid;place-items:center;letter-spacing:-.02em}
.app{font-family:GeistMono;font-size:17px;letter-spacing:.08em;color:var(--slate);text-transform:uppercase}
.title{font-weight:700;font-size:30px;color:var(--ink);margin-top:16px;letter-spacing:-.01em}
.amt{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:25px;color:var(--ink);font-weight:500}
.amt b{color:var(--tealtext);font-weight:800}
.tick{width:30px;height:30px;border-radius:50%;background:var(--ok);display:grid;place-items:center}

.chip small{display:block;font-family:GeistMono;font-weight:500;font-size:15px;letter-spacing:.08em;color:var(--slate);text-transform:uppercase;margin-bottom:4px}

/* text side (full only) */
.txt{position:absolute;left:120px;top:150px;width:840px;color:var(--ink)}
.word{font-weight:800;font-size:56px;letter-spacing:-.03em}
.h1{font-weight:800;font-size:104px;line-height:1.0;letter-spacing:-.035em;margin-top:150px}
.sub{font-size:36px;font-weight:500;color:var(--slate);margin-top:40px;line-height:1.3;max-width:720px}
.foot{position:absolute;left:120px;bottom:70px;font-family:GeistMono;font-size:20px;letter-spacing:.08em;color:var(--slate);text-transform:uppercase}
body.clear .txt, body.clear .foot{display:none}
</style></head><body class="BODYCLASS"><div class="stage">
<div class="halo"></div><div class="halo2"></div>
<div class="pshadow"></div><div class="phone"><div class="island"></div><div class="screen"><div class="status"><span>9:41</span><span>●●● ▮</span></div><img src="screen3x.png"></div></div>
<div class="notif">
  <div class="row"><div class="mark">S</div><div class="app">Splash · now</div></div>
  <div class="title">Manila Freight Services</div>
  <div class="amt">Paid <b>₱560,000</b> · Receipt verified
    <div class="tick"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  <div class="anch"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.2-8 11-4.6-1.8-8-6-8-11V5z" fill="#326273"/><path d="M8 12l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Proof anchored on Solana</div>
</div>
<div class="chip"><small>Approved</small>A person signed. Zeke can't pay.</div>
<div class="txt"><div class="word">Splash</div>
<div class="h1">Pay suppliers abroad. Prove every payment.</div>
<div class="sub">USDC payments on Solana for Southeast Asian businesses.</div></div>
<div class="foot">Sky · Sebastian &nbsp;·&nbsp; Colosseum 2026</div>
</div></body></html>
