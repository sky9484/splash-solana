# The non-custody invariant, enforced on every push and pull request.
#
# On Sui this job ran scripts/check-core-no-balance.mjs over move/splash_core.
# That package and that script were deleted with the Sui settlement layer
# (docs/solana-build/SUI-REMOVAL.md). On Solana the same promise — Splash
# structurally cannot hold client funds — is two invariants, each pinned by tests:
#
#   I-1  no Splash key is a member of a customer vault, and the vault has no
#        config authority (nobody, Splash included, can change its members);
#   I-2  USDC leaves the vault only to the quoted payout partner deposit address
#        (or the CCTP mint recipient) and the Splash fee account — never to the
#        fee payer, the vault itself, or any other Splash-controlled account.
#
# This job is deliberately narrow and needs no service, network or secret: it
# must stay green and fast enough that nobody is tempted to skip it. If it
# fails, fix the code that let a Splash key or a Splash destination in — never
# loosen the test.
name: core invariant

on:
  push:
    branches: [main, 'w*/**']
  pull_request:

jobs:
  splash-never-holds-client-funds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: I-1 and I-2 hold (no Splash key on a vault, no Splash destination)
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
               --experimental-strip-types \
               --import ./scripts/alias-hook.mjs \
               --test \
               tests/solana-chain-simulator.test.mjs \
               tests/solana-chain-squads.test.mjs \
               tests/solana-chain-payout-cctp.test.mjs \
               tests/solana-chain-payout-fee.test.mjs \
               tests/solana-chain-kora.test.mjs
